name: my_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  
  # Firebase pour le chat en temps réel
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  intl: ^0.19.0
  
  # Maps (OpenStreetMap with Leaflet)
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/images/flex_task.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/images/flex_task.png"

flutter:
  uses-material-design: true
  assets:
    - lib/images/
